<style>
/* Plan: espresso and cream, amber accent; heavy grotesk for UI, sturdy serif on cards; one daily button first, topics below. */
:root{
  --bg:#efe3d2; --surface:#fbf5ec;  --ink:#22170f; --muted:#6b5240;
  --line:#d6c2a8; --accent:#9a4a0e; --accent-ink:#fff8ef;
  --again:#b0361b; --hard:#8a5a12; --good:#3f6e16; --easy:#1f5f7a;
  --ui:"Archivo","Helvetica Neue",system-ui,sans-serif; --serif:"Source Serif 4",Georgia,serif;
 --card:#eaad4e; --cardink:#1b120c; --ca:#1b120c; --cn:#4a2f1a; --chint:#5c3e24; --clabel:#5c3e24; --csoft:rgba(255,248,235,.42); --crule:#7a4a18; --cblank:#5a2a06; --cfill:#5a2a06; --cmark:#f6d898; --cs:#8a2210; --ccautbg:rgba(255,248,235,.45); --ccaut:#5a2a06; --ctbl:rgba(27,18,12,.18); --cdeep:#5a2a06;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1f18; --surface:#382a20; --ink:#f7ecde; --muted:#c9ae94;
  --line:#56412f; --accent:#eba443; --accent-ink:#1a120d; --again:#e2603f; --hard:#e07d3c; --good:#9cc455; --easy:#6fb8d6;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#2a1f18; --surface:#382a20; --ink:#f7ecde; --muted:#c9ae94;
  --line:#56412f; --accent:#eba443; --accent-ink:#1a120d; --again:#e2603f; --hard:#e07d3c; --good:#9cc455; --easy:#6fb8d6;
  color-scheme:dark;}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{flex:1;width:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:14px 18px 22px;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:900;letter-spacing:-.01em}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;min-height:46px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.back,.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:46px;padding:0 14px;font-weight:700}
.count{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}

/* HOME */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
.hero h1{font-size:40px;line-height:1}
.hero p{margin:6px 0 0}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .num b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.ring .num span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.pill b{font-variant-numeric:tabular-nums}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:24px;padding:22px;border:1px solid var(--line);background:var(--surface)}
.big .t{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1}
.big .s{font-weight:600;color:var(--muted)}
.big.main{}
.big.main .s{}
.homegrid{display:grid;gap:14px}

/* SECTION */
.sechead h1{font-size:34px}
.sechead p{margin:4px 0 0}
.daily{border:0;border-radius:22px;padding:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px}
.daily b{font-size:24px;font-weight:900}
.daily span{font-weight:600;opacity:.92}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:56px;font-weight:800;font-size:17px;padding:0 14px}
.btn.primary{background:var(--surface);border:2px solid var(--muted);color:var(--ink)}
.topics{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.trow{display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px}
.trow:last-child{border-bottom:0}
.trow .tt{font-weight:800;font-size:17px}
.trow .ts{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.trow .bar{margin-left:auto;width:64px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.trow .bar span{display:block;height:100%;background:var(--good)}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--bg);border:1px solid var(--line)}

/* STUDY */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stage{flex:none;display:flex;height:clamp(240px,50vh,440px)}
.card{flex:1;background:var(--card);color:var(--cardink);border-radius:28px;padding:30px 22px 22px;display:flex;flex-direction:column;justify-content:safe center;align-items:center;text-align:center;gap:12px;overflow-y:auto;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.45);touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;border:2px solid transparent}
.card .label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--clabel)}
.q{font-family:var(--ui);font-weight:800;letter-spacing:-.01em;font-size:30px;line-height:1.2;max-width:20ch}
.q.long{font-size:23px;max-width:28ch}
.card hr{width:56px;border:0;border-top:3px solid var(--crule);margin:2px 0}
.a{font-family:var(--ui);font-weight:900;font-size:28px;line-height:1.35;max-width:30ch;color:var(--ca)}
.n{font-size:15px;line-height:1.4;color:var(--cn);max-width:34ch;font-weight:600}
.card.on .q,.card.on .q.long{font-size:19px;line-height:1.3;max-width:30ch;opacity:.6}
.card.on hr{opacity:.5;width:40px;margin:4px 0}
.card.on::after{content:"";flex:none;height:56px}
.hint{font-size:14px;font-weight:600;color:var(--chint)}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--cblank);color:transparent}
.fill{color:var(--cfill);border-bottom:3px solid var(--cblank)}
mark{background:var(--cmark);color:inherit;border-radius:4px;padding:0 3px}
s{color:var(--cs);text-decoration-thickness:2px}
.say{position:absolute;top:14px;right:14px;border:0;background:#ecd9bf;color:#3a2a1e;border-radius:12px;height:40px;padding:0 12px;font-weight:800;font-size:14px}
.badge{position:absolute;top:16px;left:16px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:4px 8px;background:#ecd9bf;color:#5a3f2c}
.stamp{position:absolute;top:50%;font-weight:900;font-size:24px;letter-spacing:.06em;border:4px solid;border-radius:12px;padding:4px 12px;opacity:0;pointer-events:none}
.stamp.l{left:16px;color:#b0361b;transform:translateY(-50%) rotate(-8deg)} .stamp.r{right:16px;color:#3f6e16;transform:translateY(-50%) rotate(8deg)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{border:0;border-radius:16px;min-height:64px;font-weight:800;font-size:15px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.g small{font-weight:700;font-size:12px;opacity:.9}
.g.again{background:var(--again)} .g.hard{background:var(--hard)} .g.good{background:var(--good)} .g.easy{background:var(--easy)}
:root[data-theme="dark"] .g{color:#1a120d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g{color:#1a120d}}
.cardtop{display:flex;min-height:40px;align-items:center}
.close{border:0;background:transparent;color:var(--muted);font-size:22px;font-weight:700;width:44px;height:44px;margin-left:-10px;border-radius:12px}
.gradespace{min-height:64px}
.reveal{border:0;border-radius:16px;min-height:64px;font-weight:900;font-size:18px;background:var(--surface);color:var(--ink);width:100%}
.swipehint{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:20px}
.done h2{font-size:30px}

/* TEST */
.qcard{background:var(--card);color:var(--cardink);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.qcard .q{max-width:none;text-align:left}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:56px;font-weight:600;font-size:16px}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--bg);border:1px solid var(--line)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.opt.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 18%,var(--surface))}
.feedback{font-weight:700}
.tq{padding:18px 18px}
.tq .q{font-size:22px}
.tq .q.long{font-size:19px}
.tq .n{font-size:14px}
.opts .opt{min-height:50px;padding:9px 12px;font-size:16px}
.cardtop .progress{margin-left:6px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}
.score{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.wronglist{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.wronglist div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}

/* PODCAST */
.now{flex:1;background:var(--card);color:var(--cardink);border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:260px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.now .a{color:var(--chint)} .now .a.on{color:var(--ca)}
.pbar{height:6px;border-radius:6px;background:var(--ctbl);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--cblank);width:0}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.controls button{border:1px solid var(--line);background:var(--surface);border-radius:18px;min-height:66px;font-weight:800}
.controls .play{border:2px solid var(--muted);font-size:19px}
.optsrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:600;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<script>
/* ====== KARTLAR ======
   Satır biçimi:  Soru || Cevap || Not
   {{kelime}} = boşluk doldurma, ~~yanlış~~ = düzeltilecek, ==vurgu== = vurgu */
const DATA = {
pt: { title: "Portekizce", sub: "Avrupa Portekizcesi · B1", newPerDay: 12, topics: [
["gecmis", "Geçmiş zamanlar", "Perfeito, imperfeito, ia + fiil, tinha + particípio", `
Ontem eu {{fui}} ao supermercado. (ir) || || ir ve ser → fui
Quando {{era}} criança, vivia em Ancara. (ser) || || Geçmişteki durum veya yaş → imperfeito
"Não ==tinha== tempo" ile "Não ==tive== tempo" farkı? || Tinha: o dönemin genel durumu. Tive: belirli bir anda.
"==Estive== em Sevilha" ile "==Estava== em Sevilha" farkı? || Estive: gittim, bitti. Estava: o sırada oradaydım.
"==Comi==" ile "==comia==" farkı? || Comi: bir kez yedim. Comia: yerdim, yiyordum.
Eu {{estava a dormir}} quando o telefone tocou. (dormir) || || Süren eylem → estava a + fiil. Araya giren → tocou
Düzelt: ~~Ontem eu ia ao médico.~~ (gittim) || Ontem fui ao médico. || Ia = gidecektim, giderdim
Düzelt: ~~Antigamente eu trabalhei muito.~~ || Antigamente trabalhava muito. || Alışkanlık → imperfeito
O hotel {{tinha}} uma piscina enorme. (ter) || || Tarif, özellik → imperfeito
No ano passado {{tive}} um acidente. (ter) || || Belirli, bitmiş olay → perfeito
Eu {{ia}} sair, mas começou a chover. (ir) || || Ia + fiil = niyet vardı, olmadı
Tam çıkacaktım, sen aradın. Çevir. || Ia sair quando me ligaste.
Çocukken her gün yürürdüm. Çevir. || Quando era criança, caminhava todos os dias.
Dün arkadaşımı gördüm. Çevir. || Ontem vi o meu amigo.
Ontem {{fiz}} o jantar para os amigos. (fazer) || || fiz, fizeste, fez, fizemos, fizeram
Onde é que {{puseste}} as chaves? (pôr, tu) || || pus, puseste, pôs, pusemos, puseram
Ele {{trouxe}} vinho para a festa. (trazer) || || trouxe, trouxeste, trouxe, trouxemos, trouxeram
Eles {{vieram}} de comboio. (vir) || || vim, vieste, veio, viemos, vieram
A Ana {{deu}} um presente à mãe. (dar) || || dei, deste, deu, demos, deram
Nós {{fomos}} à praia no sábado. (ir) || || fui, foste, foi, fomos, foram
Tu {{tiveste}} tempo ontem? (ter) || || tive, tiveste, teve, tivemos, tiveram
Vocês {{estiveram}} no Porto na semana passada. (estar) || || Tamamlanmış dönem → perfeito
Nós {{estávamos}} em casa quando telefonaste. (estar) || || Arka plan → imperfeito
Elas {{iam}} ao café todos os dias. (ir) || || Geçmiş alışkanlık → imperfeito
Ontem nós {{falámos}} com a Ana. (falar) || || Avrupa P.: falámos (geçmiş), falamos (şimdi)
"==Sabia==" ile "==Soube==" farkı? || Sabia: biliyordum. Soube: öğrendim, haber aldım.
Pagar, marcar, almoçar → eu (perfeito)? || paguei, marquei, almocei || -gar → -guei, -car → -quei, -çar → -cei
{{Eram}} dez horas quando cheguei. (ser) || || Geçmişte saat → imperfeito
Ontem {{não pude}} ir à aula. (poder) || || Belirli bir günde yapamadım → perfeito
Ben yemek yaparken o televizyon izliyordu. Çevir. || Enquanto eu cozinhava, ele via televisão. || Aynı anda süren iki eylem → iki imperfeito
Eskiden cumartesileri dışarı çıkardık. Çevir. || Costumávamos sair ao sábado.
Quando cheguei, o comboio já {{tinha partido}}. (partir) || || Daha önce olan → tinha + particípio
Yorgundum çünkü kötü uyumuştum. Çevir. || Estava cansado porque tinha dormido mal.
"==Comi==" ile "==Tenho comido==" farkı? || Comi: yedim, bitti. Tenho comido: son zamanlarda tekrar tekrar.
Son zamanlarda çok çalışıyorum. Çevir. || Ultimamente tenho trabalhado muito.
Düzelt: ~~Já tenho visto esse filme.~~ (bir kez) || Já vi esse filme. || Tek, bitmiş olay → perfeito
"Acabar de + fiil" ne demek? || Az önce ...-dı. || Ex.: Acabei de chegar.
"Ne dedin?" Çevir. || O que é que disseste?
`],
["conj", "Conjuntivo", "Que, talvez, embora, se, quando + conjuntivo", `
Presente do conjuntivo nasıl yapılır? || Eu formundan -o düşer: -ar → -e, -er/-ir → -a. || falo → fale, bebo → beba, parto → parta
Conjuntivo (eu): fazer / dizer / ter / vir? || faça, diga, tenha, venha
Conjuntivo (eu): pôr / poder / ver / trazer? || ponha, possa, veja, traga
Conjuntivo (eu): sair / ouvir / pedir / dormir? || saia, ouça, peça, durma
Düzensiz conjuntivo: ser / estar / ir? || seja, esteja, vá
Düzensiz conjuntivo: dar / saber / querer / haver? || dê, saiba, queira, haja
É possível que ele {{venha}} amanhã. (vir) || || É possível que + conjuntivo
É preciso que tu {{tenhas}} paciência. (ter)
É melhor que vocês {{levem}} um casaco. (levar)
"É preciso ==estudar==" ile "É preciso que ==estudes==" farkı? || Estudar: genel. Que estudes: özellikle sen.
Quero que tu {{venhas}} comigo. (vir) || || Farklı özne + istek → conjuntivo
Düzelt: ~~Quero que eu vá ao Porto.~~ || Quero ir ao Porto. || Aynı özne → infinitivo
Espero que {{gostes}} do Porto. (gostar)
Duvido que ele {{saiba}} a resposta. (saber) || || Şüphe → conjuntivo
Receio que ela não {{esteja}} em casa. (estar) || || Receio que = korkarım ki
Não acho que ele {{tenha}} razão. (ter) || || Acho que → indicativo. Não acho que → conjuntivo
Talvez {{chova}} amanhã. (chover) || || Talvez fiilden önce → conjuntivo
Embora {{esteja}} cansado, vou trabalhar. (estar) || || Embora = -sa da, rağmen
Falo devagar para que vocês {{percebam}}. (perceber)
Vamos sair antes que {{comece}} a chover. (começar)
Fico aqui até que tu {{voltes}}. (voltar)
Procuro um hotel que {{tenha}} piscina. (ter) || || Belirsiz → conjuntivo. Belli → indicativo
Oxalá não {{chova}} no sábado! (chover) || || Oxalá = umarım, inşallah
Se eu {{tivesse}} tempo, ia contigo. (ter) || || Hayali durum: se + imperfeito do conjuntivo
"Senin yerinde olsam..." Çevir. || Se eu fosse tu...
Imperfeito do conj. (eu): estar / poder / fazer / saber? || estivesse, pudesse, fizesse, soubesse
Quando {{puderes}}, liga-me. (poder) || || Gelecek: quando + futuro do conjuntivo
Assim que {{chegares}}, manda-me uma mensagem. (chegar)
"Se ==quiseres==" ile "Se ==quisesses==" farkı? || Quiseres: gerçek ihtimal. Quisesses: hayali.
Futuro do conj. (eu): ser / ter / estar / vir? || for, tiver, estiver, vier
`],
["kip", "Fiiller ve kipler", "Gelecek, kibar istek, emir, edilgen, dolaylı anlatım", `
"Yarın yağmur yağacak": konuşmada ve yazıda? || Konuşma: Amanhã vai chover. Yazı: Amanhã choverá.
Futuro (eu): fazer / dizer / trazer? || farei, direi, trarei
Alguém está a bater à porta. Quem {{será}}? || || Futuro = tahmin: "kim acaba?"
"Acaba João uyandı mı?" Çevir. || Será que o João já acordou?
Kibarca: "Pencereyi kapatabilir misiniz?" || Podia fechar a janela, por favor? || Podia = kibar istek
{{Gostaria}} de reservar uma mesa para quatro. (gostar) || || Condicional = çok kibar istek
No teu lugar, eu {{ia}} ao médico. (ir) || || Konuşmada imperfeito = "-ardım"
Düzelt (tu, olumsuz emir): ~~Não fala alto!~~ || Não fales alto!
"Buraya gel!" (tu) Çevir. || Vem cá!
"Lütfen oturun." (o senhor) Çevir. || Sente-se, por favor.
Você için emir: ir / fazer / pôr? || Vá! Faça! Ponha!
Tu için olumsuz emir: ir / dar / ser? || Não vás! Não dês! Não sejas!
Şoföre: "Hızını düşür!" (tu) || Reduz a velocidade!

<script>
/* ================= KARTLARI HAZIRLA ================= */
function hash(s){ let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const SECTIONS = {};
for(const [s, sec] of Object.entries(DATA)){
  SECTIONS[s] = { ...sec, topicMap: {}, cards: [] };
  sec.topics.forEach(([tid, title, desc, text]) => {
    const cards = text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
      const p = line.split("||").map(x => x.trim());
      const q = p[0], cloze = /\{\{.+?\}\}/.test(q);
      const answers = cloze ? [...q.matchAll(/\{\{(.+?)\}\}/g)].map(m => m[1]) : [];
      const a = p[1] || (cloze ? q.replace(/\{\{(.+?)\}\}/g, "$1").replace(/\s*\([^)]*\)\s*$/, "") : "");
      return { id: s + "." + tid + "." + hash(q), s, t: tid, q: q.replace(/\s*Çevir\.?\s*$/, ""), a, n: p[2] || "", cloze, answers };
    });
    SECTIONS[s].topicMap[tid] = { id: tid, title, desc, cards };
    SECTIONS[s].cards.push(...cards);
  });
}

/* ================= DEPOLAMA (bu cihaz) ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const today = () => dayKey(new Date());
let SRS = store.get("yk3-srs", {}); function saveSRS(){ store.set("yk3-srs", SRS); if(window.kisiselChanged) kisiselChanged(); }
/* Konusu değişen kartların ilerlemesini yeni yerine taşı (kimlik: bölüm.konu.soruHash) */
function migrateSRS(){
  const byH = {}; Object.keys(SRS).forEach(k => { const p = k.split("."); if(p.length >= 3) byH[p[0] + "." + p[p.length - 1]] = k; });
  let ch = false;
  Object.values(SECTIONS).forEach(sec => sec.cards.forEach(c => {
    if(SRS[c.id]) return; const p = c.id.split("."), k = byH[p[0] + "." + p[p.length - 1]];
    if(k){ SRS[c.id] = SRS[k]; ch = true; }
  }));
  if(ch) store.set("yk3-srs", SRS);
  return ch;
}
migrateSRS();
let LOG = store.get("yk3-log", {}); function saveLOG(){ store.set("yk3-log", LOG); if(window.kisiselChanged) kisiselChanged(); }
const DAILY_GOAL = 30;
function logDay(s, isNew){
  const t = today(); LOG[t] = LOG[t] || { reviews: 0, new: {} };
  LOG[t].reviews++; if(isNew){ LOG[t].new[s] = (LOG[t].new[s] || 0) + 1; } saveLOG();
}
const newToday = s => ((LOG[today()] || {}).new || {})[s] || 0;
function streak(){
  let n = 0; const d = new Date();
  if(!((LOG[today()] || {}).reviews)) d.setDate(d.getDate() - 1);
  while((LOG[dayKey(d)] || {}).reviews){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
let extraNew = {}; // bugün için "+10 yeni" istekleri

/* ================= ARALIKLI TEKRAR ================= */
const MIN = 60e3, DAY = 864e5;
function schedule(st, g){
  const s = st ? { ...st } : { ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const now = Date.now();
  if(g === 1){ if(st) s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2); s.ivl = 0; s.reps = 0; s.due = now + MIN; return s; }
  if(s.reps === 0){ s.ivl = g === 4 ? 4 : 1; if(g === 2) s.ease = Math.max(1.3, s.ease - 0.15); }
  else if(g === 2){ s.ivl = Math.max(1, s.ivl * 1.2); s.ease = Math.max(1.3, s.ease - 0.15); }
  else if(g === 3){ s.ivl = Math.max(s.ivl + 1, s.ivl * s.ease); }
  else { s.ivl = Math.max(s.ivl + 2, s.ivl * s.ease * 1.3); s.ease += 0.15; }
  s.ivl = Math.round(s.ivl * 10) / 10; s.reps++; s.due = now + s.ivl * DAY;
  return s;
}
const fmtIvl = st => st.ivl === 0 ? "<1 dk" : st.ivl < 30 ? Math.round(st.ivl) + " g" : st.ivl < 365 ? Math.round(st.ivl / 30) + " ay" : (Math.round(st.ivl / 36.5) / 10) + " yıl";
function poolOf(s, t){ return t === "all" ? SECTIONS[s].cards : SECTIONS[s].topicMap[t].cards; }
function stats(cards){
  const now = Date.now(); let due = 0, learned = 0, fresh = 0;
  cards.forEach(c => { const st = SRS[c.id]; if(!st) fresh++; else { if(st.reps > 0) learned++; if(st.due <= now) due++; } });
  return { due, learned, fresh, total: cards.length };
}
function newLeft(s){ return Math.max(0, SECTIONS[s].newPerDay + (extraNew[s] || 0) - newToday(s)); }

/* ================= YARDIMCILAR ================= */

function fmt(t, mode){ // mode: "blank" | "fill" | "plain"
  let h = esc(t);
  h = h.replace(/~~(.+?)~~/g, "<s>$1</s>").replace(/==(.+?)==/g, "<mark>$1</mark>");
  h = h.replace(/\{\{(.+?)\}\}/g, (m, w) => mode === "blank" ? `<span class="blank">${esc(w)}</span>` : mode === "fill" ? `<span class="fill">${w}</span>` : w);
  return h;
}
const plain = t => t.replace(/\{\{(.+?)\}\}/g, "$1").replace(/~~|==/g, "");
const isTR = t => /[ıİşŞğĞüÜöÖ]/.test(t) || /\b(ne|mi|bir|ile|ve|için|nasıl|hangi|kaç|nedir|Çevir)\b/i.test(t);
const langOf = (c, t) => c.s === "tur" ? "tr-TR" : (isTR(t) ? "tr-TR" : "pt-PT");
function go(h){ if(location.hash.replace("#","") === h) render(); else location.hash = h; }
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }
function voiceFor(lang){ try{ const vs = speechSynthesis.getVoices(); return vs.find(v => v.lang === lang) || vs.find(v => (v.lang||"").toLowerCase().startsWith(lang.slice(0,2))) || null; }catch(e){ return null; } }
function speak(text, lang, rate, onend){
  if(!("speechSynthesis" in window)){ onend && onend(); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rate || 1;
  const v = voiceFor(lang); if(v) u.voice = v;
  u.onend = () => onend && onend(); u.onerror = () => onend && onend();
  speechSynthesis.speak(u);
}
(() => { const t = store.get("yk3-theme", null); if(t) document.documentElement.setAttribute("data-theme", t); })();
function themeToggle(){

/* ================= FLASH KART ================= */
let S = null;
function buildQueue(){
  const cards = poolOf(S.s, S.t), now = Date.now();
  if(S.mode === "tumu") return shuffle(cards.slice());
  const due = shuffle(cards.filter(c => SRS[c.id] && SRS[c.id].due <= now)).sort((a, b) => SRS[a.id].reps - SRS[b.id].reps);
  const fresh = cards.filter(c => !SRS[c.id]);
  const freshPick = (S.t === "all" ? interleaveTopics(fresh) : fresh).slice(0, newLeft(S.s));
  const q = []; let i = 0, j = 0;
  while(i < due.length || j < freshPick.length){ if(i < due.length) q.push(due[i++]); if(i < due.length) q.push(due[i++]); if(j < freshPick.length) q.push(freshPick[j++]); }
  return q;
}
function interleaveTopics(cards){ // konuları sırayla karıştır (interleaving)
  const by = {}; cards.forEach(c => (by[c.t] = by[c.t] || []).push(c));
  const lists = Object.values(by), out = []; let k = 0;
  while(lists.some(l => l.length)){ const l = lists[k % lists.length]; if(l.length) out.push(l.shift()); k++; }
  return out;
}
function renderCards(s, t){
  stopSpeech();
  if(!S || S.s !== s || S.t !== t){ S = { s, t, mode: "bugun", rev: false, flipped: false, done: 0 }; S.queue = buildQueue(); }
  drawCard();
}

    bindChips();
    if($("more")) $("more").onclick = () => { extraNew[S.s] = (extraNew[S.s] || 0) + 10; S.queue = buildQueue(); drawCard(); };
    return;
  }
  const st = SRS[card.id];
  const topicName = sec.topicMap[card.t].title;
  let front, back;
  if(S.rev){ front = `<div class="q">${fmt(card.a, "plain")}</div>`; back = `<div class="a">${fmt(card.q, "plain")}</div>`; }
  else if(card.cloze){ front = `<div class="q long">${fmt(card.q, S.flipped ? "fill" : "blank")}</div>`; back = ""; }
  else { front = `<div class="q ${plain(card.q).length > 34 ? "long" : ""}">${fmt(card.q, "plain")}</div>`; back = `<div class="a">${fmt(card.a, "plain")}</div>`; }
  const prev = g => S.mode === "tumu" ? "" : `<small>${fmtIvl(schedule(st, g))}</small>`;
  app.innerHTML = head + `
    <div class="stage"><div class="card ${S.flipped && (back || S.rev) ? "on" : ""}" id="card" role="button" tabindex="0" aria-label="Kart. Dokununca cevap açılır. Sağa kaydır: biliyorum. Sola: tekrar.">
      ${front}
      ${S.flipped ? `${back ? "<hr>" + back : ""}${card.n ? `<div class="n">${fmt(card.n, "plain")}</div>` : ""}` : ""}
      <span class="stamp l" id="stL">TEKRAR</span><span class="stamp r" id="stR">BİLİYORUM</span>
    </div></div>
    ${S.flipped ? `<div class="grades">
        <button class="g again" data-g="1">Tekrar${prev(1)}</button><button class="g hard" data-g="2">Zor${prev(2)}</button>
        <button class="g good" data-g="3">İyi${prev(3)}</button><button class="g easy" data-g="4">Kolay${prev(4)}</button></div>`
      : `<div class="gradespace"></div>`}`;
  bindChips();
  const el = $("card"), flip = () => { S.flipped = !S.flipped; drawCard(); };
  if($("reveal")) $("reveal").onclick = flip;
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grade(+b.dataset.g));
  el.onkeydown = e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
  let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false;
  el.addEventListener("pointerdown", e => { drag = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", e => {
    if(!drag) return; dx = e.clientX - x0; const dy = e.clientY - y0;
    if(Math.abs(dx) > 6) moved = true;
    if(!moved && Math.abs(dy) > 10){ drag = false; return; }
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    const p = Math.min(1, Math.abs(dx) / 110);
    $("stL").style.opacity = dx < 0 ? p : 0; $("stR").style.opacity = dx > 0 ? p : 0;
    el.style.borderColor = dx > 0 ? `rgba(63,110,22,${p})` : `rgba(176,54,27,${p})`;
  });
  const end = () => {
    if(!drag) return; drag = false;
    if(!moved){ el.style.transform = ""; flip(); return; }
    if(Math.abs(dx) > 100){ el.style.transition = "transform .22s ease-out"; el.style.transform = `translateX(${dx > 0 ? 600 : -600}px) rotate(${dx > 0 ? 24 : -24}deg)`; const g = dx > 0 ? 3 : 1; setTimeout(() => grade(g), 180); }
    else { el.style.transition = "transform .2s ease-out"; el.style.transform = ""; el.style.borderColor = "transparent"; $("stL").style.opacity = 0; $("stR").style.opacity = 0; }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function bindChips(){
  const reset = () => { S.queue = buildQueue(); S.flipped = false; drawCard(); };
  if($("mBugun")) $("mBugun").onclick = () => { S.mode = "bugun"; reset(); };
  if($("mTumu")) $("mTumu").onclick = () => { S.mode = "tumu"; reset(); };
  if($("mRev")) $("mRev").onclick = () => { S.rev = !S.rev; S.mode = "tumu"; reset(); };
}
function grade(g){
  const card = S.queue.shift(); if(!card) return; S.done++;
  if(S.mode === "bugun"){
    const isNew = !SRS[card.id]; SRS[card.id] = schedule(SRS[card.id], g); saveSRS(); logDay(S.s, isNew);
    if(g === 1) S.queue.splice(Math.min(3, S.queue.length), 0, card);
  } else { logDay(S.s, false); if(g === 1) S.queue.splice(Math.min(4, S.queue.length), 0, card); }
  S.flipped = false; drawCard();
}
document.addEventListener("keydown", e => { if(S && location.hash.endsWith("-kart") && S.flipped && "1234".includes(e.key) && e.key) grade(+e.key); });

/* ================= TEST ================= */
let T = null;
const answerText = c => c.cloze ? c.answers.join(" … ") : plain(c.a);
const testable = c => answerText(c).length <= 90;
function kindOf(c){ const a = answerText(c); return c.cloze ? "cloze" : /^\d|\d{3,4}/.test(a) ? "num" : a.length < 28 ? "short" : "long"; }
function makeQuestion(c, pool){
  const right = answerText(c), kind = kindOf(c);
  const rTR = isTR(right);
  let cands = pool.filter(x => x !== c && testable(x) && answerText(x) !== right && isTR(answerText(x)) === rTR);
  const same = cands.filter(x => kindOf(x) === kind && x.t === c.t);
  const sameKind = cands.filter(x => kindOf(x) === kind);
  const picks = []; const seen = new Set([right.toLowerCase()]);
  for(const list of [shuffle(same.slice()), shuffle(sameKind.slice()), shuffle(cands.slice())]){
    for(const x of list){ const a = answerText(x); if(picks.length >= 3) break; if(!seen.has(a.toLowerCase())){ seen.add(a.toLowerCase()); picks.push(a); } }
    if(picks.length >= 3) break;
  }
  const options = shuffle([right, ...picks]);
  return { card: c, options, right: options.indexOf(right), chosen: -1 };
}
function renderTest(s, t){
  stopSpeech();
  const pool = poolOf(s, t).filter(testable);
  const seen = pool.filter(c => SRS[c.id]);
  // Önce gördüğün kartlar (geri çağırma), az sayıda yeni (ön test)
  const picks = shuffle(seen.slice()).slice(0, 8);
  const rest = shuffle(pool.filter(c => !picks.includes(c)));
  while(picks.length < Math.min(10, pool.length)) picks.push(rest.shift());
  T = { s, t, qs: shuffle(picks).map(c => makeQuestion(c, SECTIONS[s].cards)), i: 0, score: 0 };
  drawTest();
}
function drawTest(){
  const backTo = T.t === "all" ? T.s : `${T.s}-${T.t}`;
  if(T.i >= T.qs.length){
    const wrong = T.qs.filter(q => q.chosen !== q.right);
    app.innerHTML = `<div class="top"><button class="back" data-go="${backTo}">‹ Geri</button></div>
      <div class="done"><div class="score">${T.score}/${T.qs.length}</div>
      <p class="muted">${wrong.length ? "Yanlışların flash kart tekrarına eklendi." : "Hepsi doğru."}</p>
      ${wrong.length ? `<div class="wronglist">${wrong.map(q => `<div><b>${esc(answerText(q.card))}</b><br>${fmt(q.card.q, "blank")}</div>`).join("")}</div>` : ""}
      <button class="btn primary" id="again">Yeni test</button>
      <button class="btn" data-go="${T.s}-${T.t}-kart">Flash karta geç</button></div>`;
    $("again").onclick = () => renderTest(T.s, T.t);
    return;
  }
  const qq = T.qs[T.i], c = qq.card, answered = qq.chosen >= 0, L = "ABCD";
  app.innerHTML = `
    <div class="cardtop"><button class="close" data-go="${backTo}" aria-label="Testi bitir">✕</button><div class="progress" style="flex:1"><span style="width:${T.i / T.qs.length * 100}%"></span></div></div>
    <div class="qcard tq">
      <div class="q ${plain(c.q).length > 34 ? "long" : ""}">${fmt(c.q, answered ? "fill" : "blank")}</div>
      ${answered && c.n ? `<div class="n">${fmt(c.n, "plain")}</div>` : ""}</div>
    <div class="opts">${qq.options.map((o, i) => `<button class="opt ${answered ? (i === qq.right ? "right" : i === qq.chosen ? "wrong" : "") : ""}" data-o="${i}" ${answered ? "disabled" : ""}>
      <span class="k">${L[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${answered ? `<button class="btn primary" id="next">${T.i + 1 < T.qs.length ? "Sonraki" : "Sonucu gör"}</button>` : ""}`;
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    qq.chosen = +b.dataset.o; const ok = qq.chosen === qq.right; if(ok) T.score++;
    logDay(T.s, false);
    if(!ok && SRS[c.id]){ SRS[c.id] = schedule(SRS[c.id], 1); saveSRS(); }
    if(!ok && !SRS[c.id]){ SRS[c.id] = { ivl: 0, ease: 2.5, reps: 0, lapses: 0, due: Date.now() }; saveSRS(); }
    drawTest();
  });
  if($("next")) $("next").onclick = () => { T.i++; drawTest(); };
}

/* ================= PODCAST ================= */
let P = null;
function renderPodcast(s, t){
  stopSpeech();
  const backTo = t === "all" ? s : `${s}-${t}`;
  const base = poolOf(s, t);
  P = { cards: base.slice(), pos: 0, phase: 0, playing: false, rate: store.get("yk3-rate", 1), gap: store.get("yk3-gap", 2), timer: null, token: 0, shuf: false };
  app.innerHTML = `
    <div class="top"><button class="back" data-go="${backTo}">‹ Geri</button><div class="right"><span class="count" id="pcount"></span></div></div>
    <div class="chips"><button class="chip" id="pShuf" aria-pressed="false">Karıştır</button><button class="chip" id="pLearned" aria-pressed="false">Sadece öğrendiklerim</button></div>
    <div class="now"><span class="label" style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--clabel)" id="ptopic"></span>
      <div class="q long" id="pq"></div><div class="a" id="pa"></div><div class="pbar"><span id="pbar"></span></div></div>
    <div class="controls"><button id="pPrev">‹ Önceki</button><button class="play" id="pPlay">Oynat</button><button id="pNext">Sonraki ›</button></div>
    <div class="optsrow"><label for="pRate">Hız</label>
      <select id="pRate">${[0.75,0.9,1,1.15,1.3].map(r => `<option value="${r}" ${r == P.rate ? "selected" : ""}>${r}x</option>`).join("")}</select>
      <label for="pGap">Cevaptan önce</label>
      <select id="pGap">${[1,2,3,5].map(g => `<option value="${g}" ${g == P.gap ? "selected" : ""}>${g} sn bekle</option>`).join("")}</select></div>
    <p class="note">${"speechSynthesis" in window ? "Önce soru, kısa bekleme, sonra cevap. Bekleme sırasında cevabı içinden söyle. Ses gelmezse sessiz mod düğmesine bak." : "Bu tarayıcı sesli okumayı desteklemiyor. Safari'de aç."}</p>`;
  const show = () => {
    if(!P.cards.length){ $("pq").textContent = "Bu listede kart yok."; $("pa").textContent = ""; return; }
    const c = P.cards[P.pos];
    $("ptopic").textContent = SECTIONS[c.s].topicMap[c.t].title;
    $("pq").innerHTML = fmt(c.q, "blank"); $("pa").innerHTML = P.phase ? fmt(c.cloze ? c.a : c.a, "plain") + (c.n ? `<div class="n" style="margin-top:8px">${fmt(c.n, "plain")}</div>` : "") : "…";
    $("pa").className = "a" + (P.phase ? " on" : "");
    $("pcount").textContent = `${P.pos + 1} / ${P.cards.length}`;
    $("pbar").style.width = ((P.pos + (P.phase ? 1 : .5)) / P.cards.length * 100) + "%";
    $("pPlay").textContent = P.playing ? "Duraklat" : "Oynat";
  };
  const halt = () => { P.token++; clearTimeout(P.timer); stopSpeech(); };
  const step = () => {
    if(!P.playing || !P.cards.length) return;
    const tk = ++P.token, c = P.cards[P.pos];
    const qt = plain(c.q.replace(/\{\{(.+?)\}\}/g, "…")).replace(/\s*\([^)]*\)\s*$/, ""), at = plain(c.a);
    P.phase = 0; show();
    speak(qt, langOf(c, qt), P.rate * .92, () => {
      if(tk !== P.token) return;
      P.timer = setTimeout(() => {
        if(tk !== P.token) return; P.phase = 1; show();
        speak(at, langOf(c, at), P.rate * .92, () => {
          if(tk !== P.token) return;
          P.timer = setTimeout(() => { if(tk !== P.token) return; P.pos = (P.pos + 1) % P.cards.length; step(); }, 1000);
        });
      }, P.gap * 1000);
    });
  };
  P.halt = halt;
  const rebuild = () => {
    let list = base.slice();
    if($("pLearned").getAttribute("aria-pressed") === "true") list = list.filter(c => SRS[c.id] && SRS[c.id].reps > 0);
    if(P.shuf) shuffle(list);
    P.cards = list; P.pos = 0; P.phase = 0; halt(); P.playing = false; show();
  };
  $("pShuf").onclick = () => { P.shuf = !P.shuf; $("pShuf").setAttribute("aria-pressed", String(P.shuf)); rebuild(); };
  $("pLearned").onclick = () => { const b = $("pLearned"); b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); rebuild(); };
  $("pPlay").onclick = () => { P.playing = !P.playing; halt(); P.playing ? step() : show(); };
  $("pNext").onclick = () => { if(!P.cards.length) return; halt(); P.pos = (P.pos + 1) % P.cards.length; P.phase = 0; P.playing ? step() : show(); };
  $("pPrev").onclick = () => { if(!P.cards.length) return; halt(); P.pos = (P.pos - 1 + P.cards.length) % P.cards.length; P.phase = 0; P.playing ? step() : show(); };
  $("pRate").onchange = e => { P.rate = +e.target.value; store.set("yk3-rate", P.rate); };
  $("pGap").onchange = e => { P.gap = +e.target.value; store.set("yk3-gap", P.gap); };
  show();
}

const CLOUD = { db: null, uid: null, ready: false, pending: {}, writing: {}, last: {}, timers: {} };
function cloudDoc(k){ return CLOUD.db.collection("data/users/" + CLOUD.uid).doc(k); }
function cloudSave(k, obj){
  if(!CLOUD.ready) return;
  CLOUD.pending[k] = obj; clearTimeout(CLOUD.timers[k]);
  CLOUD.timers[k] = setTimeout(() => cloudFlush(k), 1500);
}
async function cloudFlush(k){
  if(CLOUD.writing[k]){ CLOUD.timers[k] = setTimeout(() => cloudFlush(k), 800); return; }
  const obj = CLOUD.pending[k]; if(!obj) return; delete CLOUD.pending[k];
  const s = JSON.stringify(obj); if(CLOUD.last[k] === s) return;
  CLOUD.writing[k] = true;
  try{ await cloudDoc(k).set(JSON.parse(s)); CLOUD.last[k] = s; }
  catch(e){ if(e && e.code === "unavailable" && !CLOUD.pending[k]){ CLOUD.pending[k] = obj; CLOUD.timers[k] = setTimeout(() => cloudFlush(k), 2000 + Math.random() * 2000); } }
  CLOUD.writing[k] = false;
}
async function cloudGet(k){
  try{
    const snap = await Promise.race([cloudDoc(k).get(), new Promise((_, r) => setTimeout(() => r("timeout"), 10000))]);
    return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
  }catch(e){ return null; }
}

function validLesson(L){
  if(!L || typeof L !== "object" || !L.explain || !Array.isArray(L.quiz)) throw { code: "parse" };

    if(q.type === "mcq") return Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length;
    if(q.type === "tf") return typeof q.answer === "boolean";
    if(q.type === "cloze") return typeof q.answer === "string" && q.answer.trim() && /_{2,}/.test(q.q);
    if(q.type === "match") return Array.isArray(q.pairs) && q.pairs.filter(p => Array.isArray(p) && p.length === 2 && p[0] && p[1]).length >= 2;
    if(q.type === "open" || q.type === "explain") return !!q.model_answer;
    return false;
  };
  L.quiz = L.quiz.filter(okQ).map(q => { if(q.retry && !okQ({ ...q.retry, type: q.type })) delete q.retry; if(q.type === "match") q.pairs = q.pairs.filter(p => Array.isArray(p) && p.length === 2 && p[0] && p[1]).slice(0, 6); return q; });

  if(L.audio && !(Array.isArray(L.audio.lines) && L.audio.lines.length)) L.audio = null;
  if(L.audio) L.audio.questions = (L.audio.questions || []).filter(q => okQ({ ...q, type: "mcq" })).map(q => ({ ...q, type: "mcq" }));
  if(L.visual && !((Array.isArray(L.visual.items) && L.visual.items.length) || (Array.isArray(L.visual.rows) && L.visual.rows.length))) L.visual = null;
  if(!L.practice || !L.practice.task) L.practice = null;
  L.next_topics = (L.next_topics || []).filter(Boolean).slice(0, 3);
  return L;
}

function topicId(title){ return "t" + hash(title.trim().toLocaleLowerCase("tr")); }
function allAsCards(){ const out = []; Object.values(AS.t).forEach(tp => (tp.cards || []).forEach(c => out.push({ ...c, topic: tp.id }))); return out; }
function asDue(){ const now = Date.now(); return allAsCards().filter(c => c.srs && c.srs.due <= now); }
function mastery(tp){
  const parts = [];
  const qr = tp.quizR || 0, qw = tp.quizW || 0; if(qr + qw) parts.push([qr / (qr + qw), 0.4]);
  const pr = tp.practice || []; if(pr.length) parts.push([pr.reduce((a, b) => a + b, 0) / (pr.length * 2), 0.3]);
  const cg = tp.cardGood || 0, cb = tp.cardBad || 0; if(cg + cb) parts.push([cg / (cg + cb), 0.3]);
  if(!parts.length) return 0;
  const w = parts.reduce((a, p) => a + p[1], 0);
  return Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / w * 100);
}
function levelFor(tp){
  const m = mastery(tp), n = (tp.history || []).length;
  if(!n) return "orta";
  return m >= 80 ? "ileri" : m < 50 ? "baslangic" : "orta";
}
function suggestions(){
  const studied = new Set(Object.values(AS.t).map(t => t.title.toLocaleLowerCase("tr")));
  const out = [];
  Object.values(AS.t).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach(tp => {
    if((tp.history || []).length && mastery(tp) < 70) out.push({ title: tp.title, why: `Eksik kaldı · %${mastery(tp)}`, id: tp.id });
    (tp.next || []).forEach(n => { if(!studied.has(n.toLocaleLowerCase("tr"))) out.push({ title: n, why: `"${tp.title}" sonrası` }); });
  });
  const seen = new Set(); return out.filter(s => { const k = s.title.toLocaleLowerCase("tr"); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
}
function inProgress(){ return Object.values(AS.t).filter(t => t.run && t.lesson).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null; }
function planNext(){
  const ip = inProgress(); if(ip) return { kind: "resume", tp: ip };
  const weak = Object.values(AS.t).filter(t => (t.history || []).length && mastery(t) < 70).sort((a, b) => mastery(a) - mastery(b))[0];
  if(weak) return { kind: "continue", tp: weak };
  const sg = suggestions().find(s => !s.id); if(sg) return { kind: "new", title: sg.title };
  return null;
}
function recordCard(tp, card, g){
  const prev = card.srs, mature = prev && prev.ivl >= 7;
  card.srs = schedule(prev, g);
  const good = g >= 3;
  tp.cardGood = (tp.cardGood || 0) + (good ? 1 : 0); tp.cardBad = (tp.cardBad || 0) + (good ? 0 : 1);
  const st = AS.idx.stats; good ? st.cardGood++ : st.cardBad++;
  if(mature) good ? st.matureGood++ : st.matureBad++;
  dayStat().reviews++;
}

const LS = { tp: null, busy: false, abort: null };
const PHASES = [["explain", "Anlatım"], ["quiz", "Test"], ["cards", "Kartlar"], ["audio", "Dinleme"], ["practice", "Uygulama"], ["summary", "Özet"]];
function phasesOf(L){ return PHASES.filter(([p]) => p !== "audio" || L.audio).filter(([p]) => p !== "practice" || L.practice); }
function ensureTopic(title){
  const id = topicId(title);
  if(!AS.t[id]) AS.t[id] = { id, title: title.trim(), category: "", created: Date.now(), history: [], covered: [], weak: [], next: [], cards: [], practice: [], quizR: 0, quizW: 0 };
  return AS.t[id];
}
function startTopic(title){
  const tp = ensureTopic(title);
  LS.tp = tp;
  if(tp.run && tp.lesson) return go("asistan-ders");
  generateLesson(tp);
}
async function generateLesson(tp){
  LS.tp = tp; LS.busy = true; LS.error = null;
  if(location.hash !== "#asistan-ders") location.hash = "asistan-ders"; else renderLesson();
  try{
    const L = validLesson(await askJSON(lessonPrompt(tp, { level: levelFor(tp) }), "complex", n => { const el = $("genprog"); if(el) el.textContent = n > 50 ? `Ders yazılıyor… ${Math.round(n / 100) / 10} bin karakter` : "Konu türü belirleniyor…"; }));
    tp.lesson = L; tp.category = L.category || tp.category;
    tp.run = { phase: "explain", qi: 0, results: [], retry: false, answered: null, wrongStreak: 0, cardsI: 0, audioI: 0, audioRes: [], practice: null, inter: null, started: Date.now() };
    asSaveTopic(tp);
  }catch(e){ LS.error = aiErrorText(e); }
  LS.busy = false;
  if(location.hash === "#asistan-ders") renderLesson();
}
function header(L, tp){
  const ph = phasesOf(L), cur = ph.findIndex(p => p[0] === tp.run.phase);
  return `<div class="top"><button class="back" data-go="asistan">‹ Asistan</button><div class="right"><span class="count">${esc(ph[cur] ? ph[cur][1] : "")}</span></div></div>
    <div class="stepper" aria-label="İlerleme">${ph.map((p, i) => `<span class="${i < cur ? "done" : i === cur ? "on" : ""}"></span>`).join("")}</div>`;
}
function nextPhase(tp){
  const ph = phasesOf(tp.lesson).map(p => p[0]);
  const i = ph.indexOf(tp.run.phase);
  tp.run.phase = ph[Math.min(ph.length - 1, i + 1)];
  if(tp.run.phase === "summary") finishLesson(tp);
  asSaveTopic(tp); renderLesson(); window.scrollTo(0, 0);
}
function renderLesson(){
  const tp = LS.tp;
  if(!tp){ return renderAsistanHome(); }
  if(LS.busy){
    app.innerHTML = `<div class="top"><button class="back" id="cancelGen">‹ Vazgeç</button></div>
      <div class="loading"><div class="spin" aria-hidden="true"></div><h2>${esc(tp.title)}</h2><p class="muted" id="genprog">Konu türü belirleniyor…</p>
      <p class="note">Öğretmen konuyu inceleyip sana özel bir mikro ders hazırlıyor. Bu 20–60 saniye sürebilir.</p></div>`;
    $("cancelGen").onclick = () => go("asistan");
    return;
  }
  if(LS.error || !tp.lesson){
    app.innerHTML = `<div class="top"><button class="back" data-go="asistan">‹ Asistan</button></div>
      <div class="done"><h2>Ders hazırlanamadı</h2><p class="muted">${esc(LS.error || "Bu konu için ders yok.")}</p>
      <button class="btn primary" id="retryGen">Tekrar dene</button></div>`;
    $("retryGen").onclick = () => generateLesson(tp);
    return;
  }
  const ph = tp.run.phase;
  if(ph === "explain") return drawExplain(tp);
  if(ph === "quiz") return drawQuiz(tp);
  if(ph === "cards") return drawLessonCards(tp);
  if(ph === "audio") return drawAudio(tp);
  if(ph === "practice") return drawPractice(tp);
  return drawSummary(tp);
}

  const items = (v.items || []).filter(i => i && (i.label || i.text));
  if(v.type === "compare") return `<div>${title}<div class="cmp">${items.map(i => `<div><b>${esc(i.label)}</b>${esc(i.text)}</div>`).join("")}</div></div>`;

async function simplify(tp, back){

const norm = s => String(s || "").trim().toLocaleLowerCase("pt").replace(/\s+/g, " ").replace(/[.!?]+$/, "");
const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
function curQuestion(tp){ const q = tp.lesson.quiz[tp.run.qi]; return tp.run.retry && q.retry ? { ...q, ...q.retry, type: q.type, why: q.why, example: q.example, retry: null } : q; }
function questionHTML(q, ans){
  const L = "ABCDE";
  if(q.type === "mcq") return `<div class="opts">${q.options.map((o, i) => `<button class="opt ${ans ? (i === q.answer ? "right" : i === ans.v ? "wrong" : "") : ""}" data-mcq="${i}" ${ans ? "disabled" : ""}><span class="k">${L[i] || i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  if(q.type === "tf") return `<div class="duo">${[[true, "Doğru"], [false, "Yanlış"]].map(([v, t]) => `<button class="btn ${ans ? "" : ""}" data-tf="${v}" ${ans ? "disabled" : ""} style="${ans && v === q.answer ? "border-color:var(--good);border-width:2px" : ans && v === ans.v ? "border-color:var(--again);border-width:2px" : ""}">${t}</button>`).join("")}</div>`;
  if(q.type === "cloze") return `<form id="clozeF" style="display:flex;flex-direction:column;gap:8px"><input class="ans" id="clozeI" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Boşluğa gelen kelime" value="${ans ? esc(ans.v) : ""}" ${ans ? "disabled" : ""} aria-label="Cevabın">${ans ? "" : `<button class="btn primary" type="submit">Kontrol et</button>`}</form>`;
  if(q.type === "match") return `<div id="matchBox"></div>`;
  return `<textarea class="ans" id="openI" placeholder="Kendi cümlelerinle yaz…" ${ans ? "disabled" : ""} aria-label="Cevabın">${ans ? esc(ans.v) : ""}</textarea>${ans ? "" : `<button class="btn primary" id="openSend">Gönder</button>`}`;
}
function drawQuiz(tp){
  const run = tp.run, L = tp.lesson;
  if(run.qi >= L.quiz.length) return drawInterleave(tp);
  const q = curQuestion(tp), ans = run.answered;
  const typeName = { mcq: "Çoktan seçmeli", tf: "Doğru mu, yanlış mı?", cloze: "Boşluğu doldur", match: "Eşleştir", open: "Kısa cevap", explain: "Kendi cümlelerinle anlat" }[q.type];
  app.innerHTML = header(L, tp) + `
    <div class="qcard"><span class="label" style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--clabel)">${typeName}${run.retry ? " · Benzer soru" : ""} · ${run.qi + 1}/${L.quiz.length}</span>
      <div class="q long" style="text-align:left;max-width:none">${esc(q.q).replace(/_{2,}/g, '<span class="blank">____</span>')}</div></div>
    ${questionHTML(q, ans)}
    <div id="fbBox">${ans ? feedbackHTML(q, ans, run) : ""}</div>`;
  bindQuestion(tp, q);
}
function feedbackHTML(q, ans, run){
  if(ans.ok === 1) return `<div class="fb ok"><b>Doğru.</b>${ans.note ? `<span>${esc(ans.note)}</span>` : ""}${ans.feedback ? `<span>${esc(ans.feedback)}</span>` : ""}</div><button class="btn primary" id="qNext">Devam</button>`;
  const right = q.type === "mcq" ? q.options[q.answer] : q.type === "tf" ? (q.answer ? "Doğru" : "Yanlış") : q.type === "cloze" ? q.answer : q.type === "match" ? "" : q.model_answer;
  const canRetry = !run.retry && q.retry;
  return `<div class="fb ${ans.ok === 0.5 ? "mid" : "no"}"><b>${ans.ok === 0.5 ? "Kısmen doğru." : "Henüz değil."}</b>
      ${ans.feedback ? `<span>${esc(ans.feedback)}</span>` : ""}
      ${q.why ? `<span><b>Neden:</b> ${esc(q.why)}</span>` : ""}
      ${q.example ? `<span><b>Başka bir örnek:</b> ${esc(q.example)}</span>` : ""}
      ${canRetry ? "" : right ? `<span><b>Doğru cevap:</b> ${esc(right)}</span>` : ""}
      ${ans.corrected ? `<span><b>Düzeltilmiş hali:</b> ${esc(ans.corrected)}</span>` : ""}</div>
    ${canRetry ? `<button class="btn primary" id="qRetry">Benzer soruyu dene</button>` : `<button class="btn primary" id="qNext">Devam</button>`}
    ${run.wrongStreak >= 2 ? `<button class="btn" id="qSimpler">Zorlanıyorum, daha basit anlat</button>` : ""}`;
}
function answerQuestion(tp, q, ans){
  const run = tp.run; run.answered = ans;
  if(!run.retry){ run.results.push({ q: q.q, type: q.type, ok: ans.ok, why: q.why || "", retryOk: null }); ans.ok === 1 ? (tp.quizR++, AS.idx.stats.quizR++) : (tp.quizW++, AS.idx.stats.quizW++); }
  else { const r = run.results[run.results.length - 1]; if(r) r.retryOk = ans.ok === 1; }
  run.wrongStreak = ans.ok === 1 ? 0 : run.wrongStreak + 1;
  asSaveTopic(tp); drawQuiz(tp);
}
function bindQuestion(tp, q){
  const run = tp.run;
  if($("qNext")) $("qNext").onclick = () => { run.qi++; run.retry = false; run.answered = null; asSaveTopic(tp); drawQuiz(tp); window.scrollTo(0, 0); };
  if($("qRetry")) $("qRetry").onclick = () => { run.retry = true; run.answered = null; asSaveTopic(tp); drawQuiz(tp); };
  if($("qSimpler")) $("qSimpler").onclick = () => { run.wrongStreak = 0; simplify(tp, "quiz"); };
  if(run.answered) return;
  app.querySelectorAll("[data-mcq]").forEach(b => b.onclick = () => { const v = +b.dataset.mcq; answerQuestion(tp, q, { v, ok: v === q.answer ? 1 : 0 }); });
  app.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { const v = b.dataset.tf === "true"; answerQuestion(tp, q, { v, ok: v === q.answer ? 1 : 0 }); });
  if($("clozeF")) $("clozeF").onsubmit = e => {
    e.preventDefault(); const v = $("clozeI").value; if(!v.trim()) return;
    const goods = [q.answer, ...(q.accept || [])].map(norm);
    let ok = goods.includes(norm(v)) ? 1 : 0, note = "";
    if(!ok && goods.map(deacc).includes(deacc(norm(v)))){ ok = 1; note = `Aksana dikkat: ${q.answer}`; }
    answerQuestion(tp, q, { v, ok, note });
  };
  if($("matchBox")) drawMatch(tp, q);
  if($("openSend")) $("openSend").onclick = async () => {
    const v = $("openI").value.trim(); if(v.length < 3) return;
    $("openSend").disabled = true; $("openSend").textContent = "Değerlendiriliyor…";
    try{
      const g = await askJSON(gradePrompt(q.q, q.model_answer, q.rubric, v, "quiz"), "default");
      const sc = Math.max(0, Math.min(2, Number(g.score) || 0));
      answerQuestion(tp, q, { v, ok: sc === 2 ? 1 : sc === 1 ? 0.5 : 0, feedback: g.feedback || "", corrected: g.corrected || "" });
    }catch(e){ $("openSend").disabled = false; $("openSend").textContent = "Gönder"; alertBox(aiErrorText(e)); }
  };
}
function drawMatch(tp, q){
  const left = q.pairs.map(p => p[0]);
  const st = tp.run.match && tp.run.match.q === q.q ? tp.run.match : (tp.run.match = { q: q.q, right: shuffle(q.pairs.map(p => p[1])), map: {}, sel: null });
  const box = $("matchBox");
  const draw = () => {
    box.innerHTML = `<div class="matchgrid">${left.map((l, i) => `<button data-l="${i}" class="${st.sel === i ? "sel" : st.map[i] != null ? "paired" : ""}">${esc(l)}${st.map[i] != null ? `<br><small>→ ${esc(st.right[st.map[i]])}</small>` : ""}</button>`).join("")}
      ${""}</div><div class="eyebrow" style="margin:8px 0">Eşini seç</div><div class="matchgrid">${st.right.map((r, j) => `<button data-r="${j}" class="${Object.values(st.map).includes(j) ? "paired" : ""}">${esc(r)}</button>`).join("")}</div>
      <button class="btn primary" id="matchCheck" ${Object.keys(st.map).length < left.length ? "disabled" : ""} style="margin-top:10px;width:100%">Kontrol et</button>`;
    box.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { const i = +b.dataset.l; if(st.map[i] != null){ delete st.map[i]; } st.sel = i; draw(); });
    box.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { if(st.sel == null) return; const j = +b.dataset.r; Object.keys(st.map).forEach(k => { if(st.map[k] === j) delete st.map[k]; }); st.map[st.sel] = j; st.sel = null; draw(); });
    $("matchCheck").onclick = () => {
      let right = 0; const wrongs = [];
      left.forEach((l, i) => { if(st.right[st.map[i]] === q.pairs[i][1]) right++; else wrongs.push(`${l} → ${q.pairs[i][1]}`); });
      const ok = right === left.length ? 1 : right >= left.length - 1 && left.length > 2 ? 0.5 : 0;
      tp.run.match = null;
      answerQuestion(tp, q, { v: right, ok, feedback: ok === 1 ? "" : `Doğru eşleşmeler: ${wrongs.join(" · ")}` });
    };
  };
  draw();
}

/* Interleaving: testin sonunda önceki konulardan 2 kart */
function drawInterleave(tp){
  const run = tp.run;
  if(run.inter == null){
    const others = allAsCards().filter(c => c.topic !== tp.id && c.srs);
    const pick = shuffle(others.slice()).sort((a, b) => a.srs.due - b.srs.due).slice(0, 2);
    run.inter = pick.map(c => ({ topic: c.topic, id: c.id })); run.interI = 0; run.interFlip = false; asSaveTopic(tp);
  }
  if(run.interI >= run.inter.length) return nextPhase(tp);
  const ref = run.inter[run.interI], otp = AS.t[ref.topic], card = otp && (otp.cards || []).find(c => c.id === ref.id);
  if(!card){ run.interI++; return drawInterleave(tp); }
  app.innerHTML = header(tp.lesson, tp) + `
    <div class="stage"><div class="card ${run.interFlip ? "on" : ""}" id="icard" role="button" tabindex="0">
      <div class="q long">${esc(card.q)}</div>${run.interFlip ? `<hr><div class="a">${esc(card.a)}</div>` : ""}</div></div>
    ${run.interFlip ? gradeButtons(card) : `<div class="gradespace"></div>`}`;
  const flip = () => { run.interFlip = true; drawInterleave(tp); };
  $("icard").onclick = flip;
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { recordCard(otp, card, +b.dataset.g); asSaveTopic(otp); run.interI++; run.interFlip = false; asSaveTopic(tp); drawInterleave(tp); });
}
function gradeButtons(card){
  const p = g => `<small>${fmtIvl(schedule(card.srs, g))}</small>`;
  return `<div class="grades"><button class="g again" data-g="1">Tekrar${p(1)}</button><button class="g hard" data-g="2">Zor${p(2)}</button><button class="g good" data-g="3">İyi${p(3)}</button><button class="g easy" data-g="4">Kolay${p(4)}</button></div>`;
}

/* --- Aşama 4: Flashcard --- */
function drawLessonCards(tp){
  const run = tp.run, L = tp.lesson;
  if(!run.cardIds){
    run.cardIds = [];
    L.flashcards.forEach(fc => {
      const id = "c" + hash(tp.id + fc.q);
      if(!tp.cards.find(c => c.id === id)) tp.cards.push({ id, q: fc.q, a: fc.a, srs: null });
      run.cardIds.push(id);
    });
    run.cardsI = 0; run.cardFlip = false; asSaveTopic(tp);
  }
  if(run.cardsI >= run.cardIds.length) return nextPhase(tp);
  const card = tp.cards.find(c => c.id === run.cardIds[run.cardsI]);
  if(!card){ run.cardsI++; return drawLessonCards(tp); }
  app.innerHTML = header(L, tp) + `
    <div class="stage"><div class="card ${run.cardFlip ? "on" : ""}" id="lcard" role="button" tabindex="0">
      <div class="q long">${esc(card.q)}</div>${run.cardFlip ? `<hr><div class="a">${esc(card.a)}</div>` : ""}</div></div>
    ${run.cardFlip ? gradeButtons(card) : `<div class="gradespace"></div>`}`;
  const flip = () => { run.cardFlip = true; drawLessonCards(tp); };
  $("lcard").onclick = flip;
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { recordCard(tp, card, +b.dataset.g); run.cardsI++; run.cardFlip = false; asSaveTopic(tp); drawLessonCards(tp); });
}

/* --- Aşama 5: Sesli öğrenme --- */
function playLines(lines, from, onLine, onEnd){
  stopSpeech(); let i = from || 0, alive = true;
  const nextL = () => { if(!alive) return; if(i >= lines.length){ onEnd && onEnd(); return; } onLine && onLine(i); const l = lines[i++]; speak(l.text, l.lang || "pt-PT", .9, () => setTimeout(nextL, 450)); };
  nextL(); return () => { alive = false; stopSpeech(); };
}

    const hl = i => A.lines.forEach((_, k) => { const el = $("al" + k); if(el) el.style.borderColor = k === i ? "var(--accent)" : "var(--line)"; });

    return;
  }
  if(run.audioI >= A.questions.length) return nextPhase(tp);

  app.innerHTML = header(tp.lesson, tp) + `

      <div class="q long" style="text-align:left;max-width:none">${esc(q.q)}</div></div>
    ${questionHTML(q, ans)}

/* --- Aşama 6: Aktif uygulama --- */
function drawPractice(tp){
  const run = tp.run, P = tp.lesson.practice, done = run.practice;
  app.innerHTML = header(tp.lesson, tp) + `
    <div class="lesson"><h3>Şimdi sen kullan</h3><h2 style="font-size:22px">${esc(P.task)}</h2>

      <span>${esc(done.feedback || "")}</span>${(done.missing || []).length ? `<span><b>Eksik:</b> ${esc(done.missing.join(", "))}</span>` : ""}

    ${done && !done.final && done.score < 2 ? `<div class="duo"><button class="btn" id="prAgain">Düzeltip tekrar gönder</button><button class="btn primary" id="prNext">Devam</button></div>`

/* --- Aşama 7: Özet --- */
function finishLesson(tp){
  const run = tp.run, L = tp.lesson;
  const res = run.results, r = res.filter(x => x.ok === 1).length;
  const weak = res.filter(x => x.ok < 1).map(x => x.q.replace(/_{2,}/g, "…").slice(0, 120));
  tp.weak = [...(tp.weak || []), ...weak].slice(-12);
  tp.covered = [...(tp.covered || []), ...(L.explain.key_points || [])].slice(-30);
  tp.next = L.next_topics || [];
  tp.history.push({ date: today(), right: r, total: res.length, practice: run.practice ? run.practice.score : null, level: L.level || "", weak });
  run.summary = { right: r, total: res.length, strong: res.filter(x => x.ok === 1).map(x => x.q).slice(0, 4), weak: res.filter(x => x.ok < 1).map(x => ({ q: x.q, why: x.why, fixed: x.retryOk })), cards: (run.cardIds || []).length, practice: run.practice ? run.practice.score : null, mastery: mastery(tp) };
  dayStat().lessons++;
}

/* ================= ASİSTAN: TEKRAR ================= */
let RV = null;
function renderReview(){
  if(!RV){
    const due = asDue();
    const by = {}; due.forEach(c => (by[c.topic] = by[c.topic] || []).push(c));
    const lists = Object.values(by).map(l => shuffle(l)), q = []; let k = 0;
    while(lists.some(l => l.length)){ const l = lists[k % lists.length]; if(l.length) q.push(l.shift()); k++; }
    RV = { q: q.map(c => ({ topic: c.topic, id: c.id })), flip: false, done: 0, good: 0 };
  }
  const ref = RV.q[0];
  if(!ref){
    const fin = () => { const pl = PLAN; RV = null; if(pl && pl.next){ startNext(pl.next); } else { PLAN = null; go("asistan"); } };
    app.innerHTML = `<div class="top"><button class="back" data-go="asistan">‹ Asistan</button></div>
      <div class="done"><h2>${RV.done ? "Tekrar bitti" : "Bekleyen tekrar yok"}</h2>
      ${RV.done ? `<p class="muted">${RV.done} kart · ilk denemede hatırlama %${Math.round(RV.good / RV.done * 100)}</p>` : ""}
      <button class="btn primary" id="rvNext">${PLAN && PLAN.next ? "Derse geç" : "Asistana dön"}</button></div>`;
    $("rvNext").onclick = fin;
    return;
  }
  const tp = AS.t[ref.topic], card = tp && (tp.cards || []).find(c => c.id === ref.id);
  if(!card){ RV.q.shift(); return renderReview(); }
  app.innerHTML = `<div class="cardtop"><button class="close" data-go="asistan" aria-label="Kapat">✕</button></div>
    <div class="stage"><div class="card ${RV.flip ? "on" : ""}" id="rcard" role="button" tabindex="0">
      <div class="q long">${esc(card.q)}</div>${RV.flip ? `<hr><div class="a">${esc(card.a)}</div>` : ""}</div></div>
    ${RV.flip ? gradeButtons(card) : `<div class="gradespace"></div>`}`;
  const flip = () => { RV.flip = true; renderReview(); };
  $("rcard").onclick = flip;
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const g = +b.dataset.g; recordCard(tp, card, g); asSaveTopic(tp);
    const first = !RV.seen || !RV.seen[card.id]; RV.seen = RV.seen || {}; RV.seen[card.id] = 1;
    if(first){ RV.done++; if(g >= 3) RV.good++; }
    const cur = RV.q.shift(); if(g === 1) RV.q.splice(Math.min(3, RV.q.length), 0, cur);
    RV.flip = false; renderReview();
  });
}

/* ================= ASİSTAN: GELİŞİM PANELİ ================= */
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
function renderStats(){
  const st = AS.idx.stats, tps = Object.values(AS.t).filter(t => (t.history || []).length);

  fc[0] = due;
  const days = [6, 5, 4, 3, 2, 1, 0].map(d => { const x = new Date(); x.setDate(x.getDate() - d); return { k: dayKey(x), l: ["Pz", "Pt", "Sa", "Ça", "Pe", "Cu", "Ct"][x.getDay()] }; });
  const mins = days.map(d => Math.round(((AS.idx.days[d.k] || {}).sec || 0) / 60)), maxM = Math.max(1, ...mins), maxF = Math.max(1, ...fc);
  const pr = st.practice || [];
  const sorted = tps.slice().sort((a, b) => mastery(b) - mastery(a));
  app.innerHTML = `<div class="top"><button class="back" data-go="asistan">‹ Asistan</button></div>
    <div class="sechead"><h1>Gelişim</h1><p class="muted">Başarı, tamamlanan ders sayısıyla değil; hatırlama ve uygulamayla ölçülür.</p></div>
    <div class="statgrid">
      <div class="stat"><b>${pct(st.cardGood, st.cardGood + st.cardBad)}</b><span>Hatırlama başarısı</span><small>${st.cardGood + st.cardBad} kart tekrarı</small></div>
      <div class="stat"><b>${pct(st.matureGood, st.matureGood + st.matureBad)}</b><span>Uzun dönem kalıcılık</span><small>7+ gün sonra hatırlanan kartlar</small></div>
      <div class="stat"><b>${pct(st.quizR, st.quizR + st.quizW)}</b><span>Test başarısı</span><small>${st.quizR + st.quizW} soru, ilk deneme</small></div>
      <div class="stat"><b>${pr.length ? pct(pr.reduce((a, b) => a + b, 0), pr.length * 2) : "–"}</b><span>Uygulama başarısı</span><small>${pr.length} görev</small></div>
      <div class="stat"><b>${tps.length}</b><span>Öğrenilen konu</span></div>
      <div class="stat"><b>${Math.floor(st.time / 3600) ? Math.floor(st.time / 3600) + " sa " : ""}${Math.round(st.time % 3600 / 60)} dk</b><span>Toplam çalışma</span></div>
    </div>
    <div class="panel"><b>Son 7 gün · dakika</b><div class="bars">${mins.map((m, i) => `<div><i style="height:${m / maxM * 70}px" title="${m} dk"></i><small>${days[i].l}</small></div>`).join("")}</div></div>
    <div class="panel"><b>Tekrar takvimi · ${due} kart bugün</b><div class="bars">${fc.map((n, i) => `<div><i style="height:${n / maxF * 70}px;background:var(--good)" title="${n} kart"></i><small>${i === 0 ? "Bugün" : "+" + i}</small></div>`).join("")}</div></div>
    ${sorted.length ? `<div class="panel"><b>Konular · güçlüden zayıfa</b>${sorted.map(t => `<div class="mrow"><span class="nm">${esc(t.title)}</span><span class="mb"><span style="width:${mastery(t)}%"></span></span><span class="pc">%${mastery(t)}</span></div>`).join("")}</div>` : `<p class="note">İlk dersini bitirdiğinde konuların burada görünecek.</p>`}`;
}

/* ================= YÖNLENDİRME ================= */
window.asistanRoute = function(h){
  if(!h.startsWith("asistan")) { if(AUDIO_STOP){ AUDIO_STOP(); AUDIO_STOP = null; } return false; }
  if(AUDIO_STOP){ AUDIO_STOP(); AUDIO_STOP = null; }
  if(h === "asistan"){ RV = null; renderAsistanHome(); }
  else if(h === "asistan-ders") renderLesson();
  else if(h === "asistan-tekrar"){ RV = null; renderReview(); }
  else if(h === "asistan-istatistik") renderStats();
  else renderAsistanHome();
  return true;
};

/* ================= BAŞLAT ================= */
if(location.hash){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){ location.hash = ""; } }
render();
(async () => {
  if(!window.claude || !window.claude.use){ SAMPLE_STATE = "none"; if(location.hash === "#asistan") render(); return; }
  claude.use("sample").then(s => { SAMPLE = s; SAMPLE_STATE = s ? "ready" : "none"; if(location.hash === "#asistan") render(); }).catch(() => { SAMPLE_STATE = "none"; });
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    CLOUD.db = db; CLOUD.uid = uid; CLOUD.ready = true;
    const a = await pullKisisel(), b = await pullAsistan();
    if((a || b) && !location.hash.includes("-kart") && !location.hash.includes("-test") && location.hash !== "#asistan-ders" && location.hash !== "#asistan-tekrar") render();
  }catch(e){}
})();

</script>
